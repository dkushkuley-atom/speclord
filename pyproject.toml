[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speclord"
version = "0.1.0"
description = "The spec layer for AI-assisted development"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Daniel Kushkuley" }]
keywords = ["specs", "ai", "development", "cli", "code-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
speclord = "speclord.cli:main"

[project.urls]
Homepage = "https://github.com/dkushkuley/speclord"
Documentation = "https://github.com/dkushkuley/speclord#readme"
Repository = "https://github.com/dkushkuley/speclord"
Changelog = "https://github.com/dkushkuley/speclord/releases"
Issues = "https://github.com/dkushkuley/speclord/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["speclord"]

[tool.coverage.report]
show_missing = true
fail_under = 85
