specVersion: "0.1.0"
inherits: "../../org.spec.yaml"

service: "speclord"
owner: "@speclord-team"

conventions:
  naming: "snake_case"
  imports: "lazy inside CLI commands, eager in library modules"
  error_handling: "raise typed SpeclordError subclasses"

testing:
  framework: "pytest"
  coverage_target: 90

security:
  - "Never execute user-provided paths without validation"
